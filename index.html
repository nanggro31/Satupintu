
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tes API Data Satu Pintu</title>
</head>
<body>
  <h3>Pengujian API Data Satu Pintu</h3>
  <button onclick="tesAPI()">Tes Koneksi POST</button>
  <pre id="hasil">Belum diuji.</pre>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx3A-yK025uz6-CW8vfPEWAXYVdglTK38LHor3HfhhxDFglsYcuIfMVslOgz-NzRAQp/exec";

    async function tesAPI() {
      const hasil = document.getElementById("hasil");
      hasil.textContent = "Sedang menguji koneksi...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "validateSession",
            args: ["token-pengujian-tidak-valid"]
          })
        });

        const data = await response.json();
        hasil.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        hasil.textContent = "GAGAL: " + error.message;
      }
    }
  </script>
</body>
</html>
